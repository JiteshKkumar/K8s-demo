apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: demo-eks
  region: ap-south-1
  version: "1.36"

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP

managedNodeGroups:

  - name: demo-workers

    instanceType: t3.medium

    desiredCapacity: 2

    minSize: 2

    maxSize: 3

    volumeSize: 20

    amiFamily: AmazonLinux2023

    labels:
      role: worker

    tags:
      project: k8s-jenkins-demo
