apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: demo

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: 747855627478.dkr.ecr.ap-south-1.amazonaws.com/demo-frontend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:

            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 15
            periodSeconds: 20

---

apiVersion: v1
kind: Service

metadata:
  name: frontend-service
  namespace: demo

spec:

  type: ClusterIP

  selector:
    app: frontend

  ports:

    - port: 80
      targetPort: 80
      protocol: TCP
