apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: demo

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: 747855627478.dkr.ecr.ap-south-1.amazonaws.com/demo-backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "3000"

            - name: ENVIRONMENT
              value: "kubernetes"

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 20

---

apiVersion: v1
kind: Service

metadata:
  name: backend-service
  namespace: demo

spec:

  type: ClusterIP

  selector:
    app: backend

  ports:

    - port: 3000
      targetPort: 3000
      protocol: TCP
